# Giữ cho dự án Supabase miễn phí không bị tạm dừng vì lâu không hoạt động.
# Supabase tạm dừng dự án sau khoảng 1 tuần không có yêu cầu nào, nên gọi 3 ngày một lần cho chắc.
# GitHub tự tắt lịch chạy của kho công khai sau 60 ngày không có hoạt động, nên workflow này
# cũng tự gia hạn lịch của chính nó mỗi lần chạy (bước cuối), không cần ai bấm gì.
name: keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi Supabase (đọc 1 dòng, không đổi dữ liệu)
        run: |
          set -e
          URL="https://sqxqltbszsbgdsgbdldo.supabase.co/rest/v1/trips?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxeHFsdGJzenNiZ2RzZ2JkbGRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NzE1MzYsImV4cCI6MjExMDU0NzUzNn0.2ayGiitku5mBBsOFiccSd7N9NVEayl70d7zWf6x6FNw"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true)
            echo "lần $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Supabase không phản hồi đúng, kiểm tra dự án có bị tạm dừng không" >&2
          exit 1
      - name: Gia hạn lịch chạy của chính workflow này (tránh bị GitHub tự tắt sau 60 ngày)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
